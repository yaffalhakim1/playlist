<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="984" viewBox="0 0 1600 984"><defs><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1600" height="984" fill="#f7f7f4"/><text x="60" y="78" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#161616">Logo concepts</text><text x="60" y="116" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b6b6b">Concepts for review — pick a direction (or tell me what you like in each).</text><rect x="60" y="150" width="474.667" height="774" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g filter="url(#grey)"><svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet">
  <title>Playlist — P with a play counter</title>
  <!-- The P is one solid silhouette. Its counter is not a round hole but a
       play mark, cut out of it: the letter and the action share one shape.

       Geometry, on a 256 grid:
       · stem 62 wide, from y=30 to y=236
       · bowl: a half-round from the stem to x=200, closed at y=140
       · counter: a triangle with a vertical back at x=112, apex at (176,84)
         its two slanted edges set at exactly 30°, so no edge is a near-miss
       · the whole mark is nudged up 4 so it sits on the optical centre -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#000000"
        d="M 62 232 V 26 H 146 A 57 57 0 0 1 146 140 H 100 V 232 Z
           M 112 54 L 112 110 L 160 82 Z"/>
</svg>
</g><g filter="url(#grey)"><svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" x="90" y="514" width="414.667" height="120" preserveAspectRatio="xMidYMid meet">
  <title>Playlist — horizontal lockup</title>
  <!-- Symbol at 176 tall, then the name set in Inter SemiBold, baseline on
       the symbol's own optical baseline. The gap is 0.42 of the symbol's
       height, which is the space that reads as one object rather than two. -->
  <g transform="translate(30, 40) scale(0.69)">
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#000000"
          d="M 62 232 V 26 H 146 A 57 57 0 0 1 146 140 H 100 V 232 Z
             M 112 54 L 112 110 L 160 82 Z"/>
  </g>
  <text x="212" y="163" font-family="Inter, Segoe UI, sans-serif" font-size="86"
        font-weight="600" letter-spacing="-2.4" fill="#000000">Playlist</text>
</svg>
</g><g filter="url(#grey)"><svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="660" width="64" height="64" preserveAspectRatio="xMidYMid meet">
