<svg width="420" height="400" viewBox="0 0 420 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Playlist</title>
  <!-- Stacked lockup: the mark over the name, centred on one axis.
       The name is set at 68, a little under the horizontal lockup's 84,
       because a stacked name carries the whole width on its own. -->
  <g transform="translate(96 44) scale(0.72)">
    <g transform="translate(-31.16 -12.99) scale(1.101)">
      <path d="M 51 70 H 126 A 29 29 0 0 1 126 128 H 90 A 29 29 0 0 0 90 186 H 155"
            stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 177 84
               Q 177 74 187 74
               L 192 74
               Q 198 74 204 79
               L 242 122
               Q 248 128 242 134
               L 204 177
               Q 198 182 192 182
               L 187 182
               Q 177 182 177 172
               Z" fill="#000000"/>
    </g>
  </g>
  <text x="210" y="330" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="68" font-weight="600" letter-spacing="-1.9" fill="#000000">Playlist</text>
</svg>
