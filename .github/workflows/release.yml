name: Release

# Builds the app for every desktop it runs on and attaches the installers to a
# GitHub Release, so a version can be installed rather than built.
#
# The build is `mygo build`, not `go build`. That is the whole difference
# between an app and an executable:
#
#   - it links Windows with `-H=windowsgui`, so no console window opens beside
#     the app, and embeds the icon resource the taskbar reads;
#   - it wraps macOS in a .app bundle with its .icns, and makes the disk image;
#   - it makes the NSIS installer, the Debian package and install.sh.
#
# A plain `go build` produces a console-subsystem executable with no icon
# resources, which is what shipped before: a terminal beside the window and a
# blank taskbar icon.
#
# Trigger it by pushing a tag, as v0.4.0, or by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, as v0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A runner that never picks the job up should fail it, not hold the release
    # open for hours. This is what a retired runner label did once.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: macos-arm64
            os: macos-latest
            platform: darwin/arm64
          - name: macos-amd64
            # macos-13 was retired; 15 is the oldest Intel image still served.
            os: macos-15-intel
            platform: darwin/amd64
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The tests need the desktop's audio stack and the tools the app leans
      # on, so they run once, on Linux, rather than in every matrix leg.
      - name: Test
        if: matrix.name == 'linux-amd64'
        run: go test ./...

      # The version in the installer, the disk image and the version resource
      # of the executable is mygo.json's, so the tag has to agree with it.
      # Otherwise the release is named v0.5.0 and its files say 0.4.0.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' mygo.json |
            sed 's/.*"\([^"]*\)"$/\1/')"
          if [ "$want" != "$got" ]; then
            echo "the tag says $want but mygo.json says $got" >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platform }}" -o dist

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          # The installers, not the archives: what a person double-clicks.
          find dist -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.deb' \) -exec cp {} out/ \;
          # The Linux tarball and its install.sh, for the machines a .deb does
          # not fit.
          find dist -type f \( \
            -name '*.tar.gz' -o \
            -name 'install.sh' \) -exec cp {} out/ \;
          ls -la out

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the notes
        run: |
          cat > notes.md <<'EOF'
          A native desktop player for YouTube playlists. Paste a link, and it plays
          the music of it.

          ## What's new in 0.6.0

          **Last.fm scrobbling.** Connect your account in **Look → Last.fm** and the
          track you play goes to your profile: what is playing now, and a scrobble
          once you have heard half of it, or four minutes, whichever comes first.
          Tracks of thirty seconds or less are never scrobbled.

          The count comes from the player's position, not the clock, so holding a
          track, a buffering stall, or dragging the seek bar forward does not
          scrobble it.

          Plays that cannot be sent wait on disk and go out when the network is
          back, oldest first. Nothing is lost to a restart or a night offline.

          Last.fm issues an API key per application, so the app asks for yours: make
          one at last.fm/api/account/create, paste the key and secret into the Look
          page, then Connect. Your browser opens Last.fm's own page, and the app
          never sees your password. `docs/lastfm.md` has the details.

          ## Install

          | Your machine | File | How |
          |---|---|---|
          | Windows | `Playlist Setup <version> amd64.exe` | Run it. It installs Playlist, and no terminal opens. |
          | Windows, no install | `Playlist.exe` | The same app, portable. Put it anywhere and run it. |
          | macOS, Apple silicon | `Playlist <version> arm64.dmg` | Open it, drag Playlist to Applications. |
          | macOS, Intel | `Playlist <version> amd64.dmg` | The same. |
          | Debian, Ubuntu | `playlist_<version>_amd64.deb` | `sudo dpkg -i` it, or install from your file manager. |
          | Other Linux | `playlist-<version>-linux-amd64.tar.gz` | Unpack it, then run `./install.sh`. |

          GitHub turns the spaces in a file name into dots, so the Windows files
          are listed as `Playlist.Setup.<version>.amd64.exe` and the disk images
          as `Playlist.<version>.arm64.dmg`. They are the same files.

          The macOS builds are ad-hoc signed, not notarized, so the first launch
          needs right-click, Open. That is the price of shipping without a paid
          Apple developer account.

          ## Before it will play

          Two programs have to be on your PATH, and the app says so plainly when
          one is missing:

          - [yt-dlp](https://github.com/yt-dlp/yt-dlp), which finds the audio of a track
          - [ffmpeg](https://ffmpeg.org), which decodes it

          The playlist itself is read by the app over the network, and kept, so
          opening the same playlist again needs no network at all.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The version in the file names is the one in mygo.json, so the notes
          # can name the files exactly.
          VERSION="${TAG#v}"
          sed -i "s/<version>/$VERSION/g" notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
          fi
