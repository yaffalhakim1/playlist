name: Pages

# Publishes site/ to GitHub Pages. The page is static: no build step, so what is
# in the folder is what is served.
#
# Enable it once, in the repository settings: Settings → Pages → Build and
# deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push replace a queued one rather
# than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page
        run: |
          set -e
          # The files the page needs, and the ones a crawler looks for. A broken
          # link here is a page that 404s on its own screenshot.
          for f in index.html styles.css tokens.css base.css main.js sitemap.xml \
                   robots.txt site.webmanifest assets/social.png assets/b-small.svg \
                   assets/favicon.svg assets/favicon.ico assets/apple-touch-icon.png \
                   assets/window-playlist.png assets/window-playlist-dark.png \
                   assets/window-player.png assets/window-home.png \
                   assets/window-appearance.png assets/window-stats.png \
                   assets/fonts/PlusJakartaSans-Regular.woff2 \
                   assets/fonts/PlusJakartaSans-Medium.woff2 \
                   assets/fonts/PlusJakartaSans-SemiBold.woff2 \
                   assets/fonts/PlusJakartaSans-Bold.woff2 \
                   assets/fonts/OFL.txt; do
            if [ ! -f "site/$f" ]; then
              echo "missing site/$f" >&2
              exit 1
            fi
          done
          # Every asset the HTML, the CSS and the script reference has to exist,
          # or the page ships a broken image or a silent fallback font.
          grep -oh 'assets/[A-Za-z0-9._/-]*' site/index.html site/*.css site/main.js \
            | sort -u | while read -r ref; do
            if [ ! -f "site/$ref" ]; then
              echo "the page references $ref, which is not in site/" >&2
              exit 1
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
