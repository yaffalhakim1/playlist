<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>Playlist</title><g transform="translate(-24.01 -25.79) scale(1.197)" fill="none">
  
  <!-- The small cut of the Ribbon Queue.

       At 16 px the two folds of the full mark collapse into a squiggle, so
       this cut does the two things that buy clarity at that size and nothing
       else: the stroke thickens relative to the mark, and the gap to the
       triangle closes to a hair, because at 16 px a full-stroke gap is barely
       one pixel and reads as a break.

       It is the same idea — a queue that folds and arrives at a play mark —
       with the folds shortened so the band is still legible as a band.

       On this grid, stroke 26 (was 20):
       · runs at y=72, 128, 184, 56 apart
       · turns of radius 28, half the run spacing
       · the band spans x=52..150
       · the triangle is 88 tall, 76 wide, base at x=168: a 10 gap
       · placed with the same computed transform as the master -->
  <g transform="translate(-33.4 -13.6) scale(1.11)">
    <path d="M 52 72 H 122 A 28 28 0 0 1 122 128 H 94 A 28 28 0 0 0 94 184 H 150"
          stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 168 84
             Q 168 74 178 74
             L 184 74
             Q 190 74 196 79
             L 234 122
             Q 240 128 234 134
             L 196 177
             Q 190 182 184 182
             L 178 182
             Q 168 182 168 172
             Z" fill="#000000"/>
  </g>
</g></svg>